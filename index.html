* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  background: #111827;
  color: white;

  text-align: center;
}

h1 { color: #a78bfa; }

p { color: #cbd5e1; }

.camera {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
  overflow: hidden;
  border-radius: 20px;
  background: #000;
  aspect-ratio: 3 / 4;
}

video, canvas {
  position: absolute;
  width: 100%;
  height: 100%;
  inset: 0;
  object-fit: cover;
  transform: scaleX(-1);
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px;
  margin: 5px;
  background: #7c3aed;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:active { background: #5b21b6; }

.masks {

}

}

.masks button.active {
  background: #7c3aed;
}
